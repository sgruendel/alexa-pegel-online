name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        timezone: [UTC, Europe/Berlin]
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.timezone == 'UTC' }}
        with:
          name: runtime-coverage
          path: lambda/coverage/
